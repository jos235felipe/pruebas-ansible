---
# =============================================================
# Playbook: Crear scripts START JBoss TCIB HA (Nodo 1 y Nodo 2)
# Target: Servidor MICOOPE en Línea (único servidor)
# Crea 3 archivos .bat en C:\NOC:
#   - Environment.bat
#   - START_TCIB_NODO1.bat
#   - START_TCIB_NODO2.bat
# =============================================================
- name: Crear scripts START JBoss TCIB HA
  hosts: all
  gather_facts: no

  vars:
    noc_base: "C:\\NOC"

  tasks:

    - name: Asegurar que existe la carpeta C:\NOC
      ansible.windows.win_file:
        path: "{{ noc_base }}"
        state: directory

    - name: Crear Environment.bat
      ansible.windows.win_copy:
        dest: "{{ noc_base }}\\Environment.bat"
        content: |
          @echo off
          TITLE TAFJ Shell
          set JAVA_HOME=C:\Temenos\R18\Java\jdk1.8.0_181
          set PATH=%JAVA_HOME%\bin;%PATH%
          set JBCJVMLIB=C:\Temenos\R18\Java\jdk1.8.0_181\jre\bin\server\jvm.dll
          set CLASSPATH=C:\windows\system32;

    - name: Crear START_TCIB_NODO1.bat
      ansible.windows.win_copy:
        dest: "{{ noc_base }}\\START_TCIB_NODO1.bat"
        content: |
          @echo off
          echo Iniciando TCIB Nodo 1 (HA)...
          call Environment.bat
          rem ========================================
          rem JVM HEAP & ENGINE CONFIGURATION (HA)
          rem ========================================
          set "JAVA_OPTS=%JAVA_OPTS% -Xms20g -Xmx20g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled"
          set "JAVA_OPTS=%JAVA_OPTS% -Dsun.rmi.transport.tcp.responseTimeout=30000 -Dorg.apache.tomcat.util.http.Parameters.MAX_COUNT=5000 -Djboss.as.management.blocking.timeout=300"
          set "JAVA_OPTS=%JAVA_OPTS% -Djava.net.preferIPv4Stack=true"
          rem ========================================
          rem OpenTelemetry Java Agent - PRODUCCIÓN HA
          rem ========================================
          set "JAVA_OPTS=%JAVA_OPTS% -javaagent:C:\telemetry\opentelemetry-javaagent.jar"
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.service.name=TCIB125_1"
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.resource.attributes=service.version=7.1,deployment.environment=production,client=TCIB,host.name=%COMPUTERNAME%,jboss.instance=TCIB125_1"
          rem Endpoint OTLP HTTP (Alloy Local)
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.exporter.otlp.endpoint=http://localhost:4318"
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.exporter.otlp.protocol=http/protobuf"
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.traces.exporter=otlp"
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.metrics.exporter=otlp"
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.logs.exporter=none"
          rem Correlación y Sampling (5%)
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.instrumentation.log4j-appender.experimental.capture-mdc-attributes=*"
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.instrumentation.logback-appender.experimental.capture-mdc-attributes=*"
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.traces.sampler=parentbased_traceidratio"
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.traces.sampler.arg=0.05"
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.metric.export.interval=60000"
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.bsp.schedule.delay=5000"
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.javaagent.debug=false"
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.instrumentation.jvm.enabled=true"
          rem ========================================
          rem ARRANQUE JBOSS - NODO 1
          rem ========================================
          start "TCIB_NODO_1" C:\Temenos\R18\jboss-eap-7.1\bin\standalone.bat --server-config=t24-ha.xml -b 0.0.0.0 -bmanagement 0.0.0.0 -bprivate 127.0.0.1 -Djboss.node.name=TCIB_NODO_1
          exit /b 0

    - name: Crear START_TCIB_NODO2.bat
      ansible.windows.win_copy:
        dest: "{{ noc_base }}\\START_TCIB_NODO2.bat"
        content: |
          @echo off
          echo Iniciando TCIB Nodo 2...
          call Environment.bat
          rem ========================================
          rem JVM HEAP CONFIGURATION
          rem ========================================
          set "JAVA_OPTS=%JAVA_OPTS% -Xms20g -Xmx20g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled"
          set "JAVA_OPTS=%JAVA_OPTS% -Dsun.rmi.transport.tcp.responseTimeout=30000 -Dorg.apache.tomcat.util.http.Parameters.MAX_COUNT=5000 -Djboss.as.management.blocking.timeout=300"
          rem Opcional pero recomendado para G1GC
          set "JAVA_OPTS=%JAVA_OPTS% -XX:+ParallelRefProcEnabled"
          set "JAVA_OPTS=%JAVA_OPTS% -XX:MaxGCPauseMillis=200"
          rem ========================================
          rem OpenTelemetry Java Agent - PRODUCCIÓN
          rem JBoss: TCIB (o el nombre de tu instancia)
          rem ========================================
          rem 1. RUTA DEL AGENTE (Asegúrate de que el .jar exista aquí)
          set "JAVA_OPTS=%JAVA_OPTS% -javaagent:C:\telemetry\opentelemetry-javaagent.jar"
          rem 2. INFORMACIÓN DEL SERVICIO (Etiquetas base)
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.service.name=TCIB125_2"
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.resource.attributes=service.version=7.1,deployment.environment=production,client=TCIB,host.name=%COMPUTERNAME%,jboss.instance=TCIB125_2"
          rem ========================================
          rem 3. ENDPOINT: Apuntar al Alloy Local (Puerto 4318 OTLP HTTP)
          rem ========================================
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.exporter.otlp.endpoint=http://localhost:4318"
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.exporter.otlp.protocol=http/protobuf"
          rem Exportadores (Qué vamos a enviar)
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.traces.exporter=otlp"
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.metrics.exporter=otlp"
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.logs.exporter=none"
          rem ========================================
          rem 4. CORRELACIÓN DE LOGS (Inyecta trace_id en el server.log)
          rem ========================================
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.instrumentation.log4j-appender.experimental.capture-mdc-attributes=*"
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.instrumentation.logback-appender.experimental.capture-mdc-attributes=*"
          rem ========================================
          rem 5. SAMPLING Y RENDIMIENTO (Protege tu CPU y Red)
          rem ========================================
          rem Solo captura el 5% de las trazas nuevas para no saturar Tempo
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.traces.sampler=parentbased_traceidratio"
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.traces.sampler.arg=0.05"
          rem Relaja el Garbage Collector enviando métricas cada 60 segundos
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.metric.export.interval=60000"
          set "JAVA_OPTS=%JAVA_OPTS% -Dotel.bsp.schedule.delay=5000"
          rem 1. Definimos la ruta de tu nueva configuracion (Nodo 2)
          set "SERVER_BASE_DIR=C:\Temenos\R18\TCIBNODO2\standalone"
          rem 2. Llamamos al MISMO motor de JBoss del Nodo 1, pero le inyectamos la nueva ruta y el offset de puertos
          set "JAVA_OPTS=%JAVA_OPTS% -Djava.net.preferIPv4Stack=true"
          start "TCIB_NODO_2" C:\Temenos\R18\TCIBNODO2\bin\standalone.bat -Djboss.server.base.dir="%SERVER_BASE_DIR%" --server-config=t24-ha.xml -b 0.0.0.0 -bmanagement 0.0.0.0 -bprivate 127.0.0.1 -Djboss.socket.binding.port-offset=100 -Djboss.node.name=TCIB_NODO_2
          exit /b 0

    - name: Confirmar archivos creados
      ansible.builtin.debug:
        msg:
          - "[OK] {{ noc_base }}\\Environment.bat"
          - "[OK] {{ noc_base }}\\START_TCIB_NODO1.bat"
          - "[OK] {{ noc_base }}\\START_TCIB_NODO2.bat"