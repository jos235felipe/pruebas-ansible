---
- name: Limpiar logs de JBoss y TAFJ
  hosts: all
  gather_facts: no

  vars:
    jboss_root: "C:\\Temenos\\R18\\3rdParty\\As"
    tafj_log: "C:\\Temenos\\R18\\TAFJ\\log"
    jboss_principal_log: "C:\\Temenos\\R18\\3rdParty\\As\\jboss-eap-7.2\\standalone\\log"

  tasks:

    # ---------------------------------------------------------
    # 1. LIMPIEZA LOGS TAFJ (Validando existencia)
    # ---------------------------------------------------------
    - name: Borrar logs de TAFJ
      win_shell: |
        if (Test-Path "{{ tafj_log }}") {
            Get-ChildItem -Path "{{ tafj_log }}" -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force -Recurse -ErrorAction SilentlyContinue
        }
      register: tafj_clean
      changed_when: true

    - name: Confirmar limpieza de logs TAFJ
      ansible.builtin.debug:
        msg: "[OK] Logs de TAFJ procesados en: {{ tafj_log }}"

    # ---------------------------------------------------------
    # 2. LIMPIEZA LOGS JBOSS PRINCIPAL
    # ---------------------------------------------------------
    - name: Borrar logs de JBoss principal (jboss-eap-7.2)
      win_shell: |
        if (Test-Path "{{ jboss_principal_log }}") {
            Get-ChildItem -Path "{{ jboss_principal_log }}" -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force -Recurse -ErrorAction SilentlyContinue
        }
      register: principal_clean
      changed_when: true

    - name: Confirmar limpieza de logs JBoss principal
      ansible.builtin.debug:
        msg: "[OK] Logs de JBoss principal procesados en: {{ jboss_principal_log }}"

    # ---------------------------------------------------------
    # 3. DETECCIÓN Y FILTRADO DE SECUNDARIOS
    # ---------------------------------------------------------
    - name: Detectar JBoss secundarios (T24Prod01* y T24Prod02*)
      win_find:
        paths: "{{ jboss_root }}"
        file_type: directory
      register: jboss_dirs

    - name: Filtrar solo carpetas T24Prod01* y T24Prod02*
      ansible.builtin.set_fact:
        jboss_secundarios: "{{ jboss_dirs.files
          | map(attribute='filename')
          | select('match', '.*(T24Prod01|T24Prod02).*')
          | sort
          | list }}"

    - name: Mostrar JBoss secundarios detectados
      ansible.builtin.debug:
        msg: "JBoss secundarios detectados: {{ jboss_secundarios }}"

    - name: Avisar si no hay JBoss secundarios
      ansible.builtin.debug:
        msg: "[INFO] Este servidor no tiene JBoss secundarios. Solo se limpiaron TAFJ y JBoss principal."
      when: jboss_secundarios | length == 0

    # ---------------------------------------------------------
    # 4. LIMPIEZA LOGS JBOSS SECUNDARIOS
    # ---------------------------------------------------------
    - name: Borrar logs de JBoss secundarios
      win_shell: |
        $secPath = "{{ jboss_root }}\\{{ item }}\\standalone\\log"
        if (Test-Path $secPath) {
            Get-ChildItem -Path $secPath -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force -Recurse -ErrorAction SilentlyContinue
        }
      loop: "{{ jboss_secundarios }}"
      loop_control:
        label: "{{ item }}"
      when: jboss_secundarios | length > 0
      changed_when: true

    - name: Confirmar limpieza de logs JBoss secundarios
      ansible.builtin.debug:
        msg: "[OK] Logs procesados en: {{ jboss_root }}\\{{ item }}\\standalone\\log"
      loop: "{{ jboss_secundarios }}"
      loop_control:
        label: "{{ item }}"
      when: jboss_secundarios | length > 0

    # ---------------------------------------------------------
    # 5. RESUMEN FINAL
    # ---------------------------------------------------------
    - name: Resumen final de limpieza
      ansible.builtin.debug:
        msg:
          - "========================================="
          - "RESUMEN DE LIMPIEZA DE LOGS"
          - "========================================="
          - "[OK] {{ tafj_log }}"
          - "[OK] {{ jboss_principal_log }}"
          - "{% for j in jboss_secundarios %}[OK] {{ jboss_root }}\\{{ j }}\\standalone\\log{% if not loop.last %} {% endif %}{% endfor %}"
          - "========================================="
