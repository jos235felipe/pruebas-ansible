---
- name: Detener JBoss (Principal y Secundarios) con Timeout y Kill
  hosts: all
  gather_facts: no

  vars:
    jboss_base_path: "C:\\Temenos\\R18\\3rdParty\\As"
    shutdown_timeout_seconds: 30

  tasks:
    # ---------------------------------------------------------
    # 1. DESCUBRIMIENTO DE INSTANCIAS (Principal + Secundarios)
    # ---------------------------------------------------------
    - name: Identificar todas las instancias JBoss (jboss-eap-7.2 y T24Prod*)
      ansible.windows.win_find:
        paths: "{{ jboss_base_path }}"
        file_type: directory
        patterns:
          - "jboss-eap-7.2"
          - "T24Prod*"
      register: jboss_dirs

    # ---------------------------------------------------------
    # 2. APAGADO Y CONTROL DE PROCESOS
    # ---------------------------------------------------------
    - name: Detener o matar cada instancia JBoss detectada
      ansible.windows.win_shell: |
        $instancePath = "{{ item.path }}"
        $instanceName = "{{ item.filename }}"
        $cliScript = "$instancePath\bin\jboss-cli.bat"
        $timeout = {{ shutdown_timeout_seconds }}
        $mgmtPort = 9990

        # Determine puerto de gestión según la convención del nombre
        if ($instanceName -eq "jboss-eap-7.2") {
            # Instancia Principal (HTTP 8081 -> MGMT offset suele ser 9990 o 9991)
            # Buscamos el .bat genérico de inicio si existe en la raíz
            $batFiles = Get-ChildItem -Path "{{ jboss_base_path }}" -Filter "*{{ item.filename }}*.bat" -ErrorAction SilentlyContinue
            if ($batFiles) {
                $content = Get-Content $batFiles[0].FullName -Raw
                if ($content -match "port-offset=(\d+)") {
                    $mgmtPort = 9990 + [int]$matches[1]
                }
            }
        } else {
            # Instancias Secundarias (T24Prod*)
            $batFile = "{{ jboss_base_path }}\JBoss_${instanceName}_R20.bat"
            if (Test-Path $batFile) {
                $content = Get-Content $batFile -Raw
                if ($content -match "port-offset=(\d+)") {
                    $mgmtPort = 9990 + [int]$matches[1]
                }
            }
        }

        # 1. Obtener PID asociado a la carpeta de la instancia
        $proc = Get-CimInstance Win32_Process -Filter "Name = 'java.exe'" | 
                Where-Object { $_.CommandLine -like "*$instancePath*" }

        if (-not $proc) {
            Write-Host "La instancia $instanceName ya se encuentra detenida."
            exit 0
        }

        $pidToKill = $proc.ProcessId
        Write-Host "Instancia $instanceName activa con PID: $pidToKill (Puerto MGMT: $mgmtPort)"

        # 2. Intentar Shutdown suave por JBoss CLI
        Write-Host "Enviando :shutdown a $instanceName..."
        & "$cliScript" --connect --controller=localhost:$mgmtPort command=:shutdown 2>&1 | Out-Null

        # 3. Monitorear apagado
        $elapsed = 0
        $stopped = $false

        while ($elapsed -lt $timeout) {
            $checkProc = Get-Process -Id $pidToKill -ErrorAction SilentlyContinue
            if (-not $checkProc) {
                $stopped = $true
                break
            }
            Start-Sleep -Seconds 3
            $elapsed += 3
        }

        # 4. Kill forzado si expiró el tiempo
        if ($stopped) {
            Write-Host "$instanceName apagó correctamente."
        } else {
            Write-Warning "Timeout alcanzado para $instanceName. Forzando Kill al PID $pidToKill..."
            Stop-Process -Id $pidToKill -Force -ErrorAction SilentlyContinue
            
            # Limpieza adicional de subprocesos
            Get-CimInstance Win32_Process | 
                Where-Object { $_.CommandLine -like "*$instancePath*" } | 
                ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
        }
      loop: "{{ jboss_dirs.files }}"
      ignore_errors: yes

    # ---------------------------------------------------------
    # 3. LIMPIEZA DE CARPETAS (tmp, data, log)
    # ---------------------------------------------------------
    - name: Borrar carpetas tmp, data y log de cada instancia
      ansible.windows.win_file:
        path: "{{ item.0.path }}\\standalone\\{{ item.1 }}"
        state: absent
      loop: "{{ jboss_dirs.files | product(['tmp', 'data', 'log']) | list }}"
      ignore_errors: yes

    # ---------------------------------------------------------
    # 4. ELIMINAR ARCHIVOS DE ESTADO
    # ---------------------------------------------------------
    - name: Limpiar marcadores de despliegue en cada instancia
      ansible.windows.win_shell: |
        $deployDir = "{{ item.path }}\standalone\deployments"
        
        if (Test-Path $deployDir) {
            Write-Host "Limpiando marcadores en: $deployDir"
            Remove-Item -Path "$deployDir\*.deployed", "$deployDir\*.undeployed", "$deployDir\*.failed", "$deployDir\*.isdeploying", "$deployDir\*.dodeploy" -Force -ErrorAction SilentlyContinue
        }
      loop: "{{ jboss_dirs.files }}"

    # ---------------------------------------------------------
    # 5. RECREAR CARPETA LOGS
    # ---------------------------------------------------------
    - name: Recrear carpeta logs vacía
      ansible.windows.win_file:
        path: "{{ item.path }}\\standalone\\log"
        state: directory
      loop: "{{ jboss_dirs.files }}"
